[project]
name = "tradingbot"
version = "0.1.0"
description = "Event-driven automated trading bot for the Alpaca brokerage API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

# Version numbers are FLOORS, not pins. `uv lock` resolves the real versions
# into uv.lock, which is what production installs from. See docs/tech-stack.md.
dependencies = [
    # Broker
    "alpaca-py>=0.33",
    # Config and CLI
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.13",
    # Data and compute
    "numpy>=2.1",
    "polars>=1.12",
    "pyarrow>=18.0",
    "duckdb>=1.1",
    # Storage
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    # Observability
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "apprise>=1.9",
]

[project.scripts]
tradingbot = "tradingbot.__main__:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "time-machine>=2.16",
    "respx>=0.21",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]
# Used once, to validate the hand-written numpy indicators against a reference
# implementation. Not a runtime dependency, and not required for the suite to
# pass -- those tests skip if it is absent. Needs the TA-Lib C library present
# first, which is why it is isolated here. See docs/tech-stack.md.
indicators-ref = ["TA-Lib>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingbot"]

# ----------------------------------------------------------------------------
# Lint / format
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
# Ruff formats Python code blocks inside Markdown. The docs align comments for
# readability, so keep the formatter out of prose.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes -- every timestamp here must be tz-aware
    "T20",       # no print(); use the logger
    "SIM",       # simplify
    "ARG",       # unused arguments
    "PTH",       # pathlib over os.path
    "ERA",       # commented-out code
    "PL",        # pylint subset
    "RUF",
]
ignore = [
    "PLR0913",   # many arguments -- order construction legitimately has them
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "ARG"]

# ADR 0008 (Decimal for money) is enforced by RUF032, decimal-from-float-literal,
# which the "RUF" selection above already includes.

# ----------------------------------------------------------------------------
# Types
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages without complete type coverage.
module = ["alpaca.*", "apprise.*", "duckdb.*", "talib.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# Tests
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "paper: hits the live Alpaca PAPER API; refuses to run in live mode",
    "integration: full engine against SimulatedBroker and recorded fixtures",
    "slow: excluded from the fast pre-commit run",
]
# Warnings are errors, with named exceptions for third-party noise we cannot
# fix. Keep this list short and specific -- a blanket ignore here would hide
# the deprecations that matter.
filterwarnings = [
    "error",
    # alpaca-py 0.44 imports websockets.legacy at module import time.
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    "ignore:remove second argument of ws_handler:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/tradingbot"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
# Global floor. docs/testing.md requires 90% for risk/ and execution/,
# enforced separately in CI rather than by this single number.
fail_under = 70
